# tmux(prefix C-t)の操作感に合わせた最小構成。ここにない項目はデフォルトに従う
# デフォルト一覧: herdr --default-config

onboarding = false

[theme]
name = "catppuccin"

[ui]
pane_gaps = false
sidebar_collapsed_mode = "hidden"

agent_panel_sort = "spaces"

[experimental]
kitty_graphics = true

[keys]
prefix = "ctrl+t"

# iPhone/Termius用にFキーを追加(既存のprefixバインドは維持)
zoom = ["prefix+t", "f5"]
cycle_pane_next = "f6"
cycle_pane_previous = "f7"
close_pane = ["prefix+q", "f8"]

split_horizontal = ["prefix+s", "f9"]
split_vertical = "f10"
settings = "prefix+shift+s"

detach = "prefix+d"

rename_tab = "prefix+comma"

next_agent = "prefix+a"
previous_agent = "prefix+shift+a"

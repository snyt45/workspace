<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>annotate</title>
<style>
/* mark style adapted from neat-annotations (MIT) https://github.com/syabro/neat-annotations */
:root{
  color-scheme: light dark;
  --bg:#faf8f3; --fg:#2b2a27; --dim:#8a857a; --line:#e6e1d6;
  --code-bg:#fffdf8; --ln:#b8b2a4;
  --y:#b8751a; --y-mark:rgba(255,176,0,.16);
  --r:#c45a38; --r-mark:rgba(216,90,56,.13);
  --b:#4a74b8; --b-mark:rgba(90,141,214,.15);
  --card-bg:#fffef9;
  --syn-kw:#8a4bb0; --syn-str:#a05a12; --syn-num:#b85a00; --syn-fn:#2d6cb5;
  --syn-op:#4a5568; --syn-com:#8a857a; --syn-var:#a06a00;
  --hand:"Shantell Sans","Hiragino Maru Gothic ProN","BIZ UDGothic",cursive,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1e1d1a; --fg:#e8e4da; --dim:#96917f; --line:#3a382f;
    --code-bg:#232219; --ln:#5f5a4c;
    --y:#e0b13e; --y-mark:rgba(224,177,62,.20);
    --r:#e07a5a; --r-mark:rgba(224,110,80,.18);
    --b:#7aa5e0; --b-mark:rgba(122,165,224,.18);
    --card-bg:#2a2822;
    --syn-kw:#c79be0; --syn-str:#d9a05a; --syn-num:#e0a05a; --syn-fn:#7aa5e0;
    --syn-op:#a8b0bc; --syn-com:#8d8a7a; --syn-var:#e0b13e;
  }
}
:root[data-theme="dark"]{
  --bg:#1e1d1a; --fg:#e8e4da; --dim:#96917f; --line:#3a382f;
  --code-bg:#232219; --ln:#5f5a4c;
  --y:#e0b13e; --y-mark:rgba(224,177,62,.20);
  --r:#e07a5a; --r-mark:rgba(224,110,80,.18);
  --b:#7aa5e0; --b-mark:rgba(122,165,224,.18);
  --card-bg:#2a2822;
  --syn-kw:#c79be0; --syn-str:#d9a05a; --syn-num:#e0a05a; --syn-fn:#7aa5e0;
  --syn-op:#a8b0bc; --syn-com:#8d8a7a; --syn-var:#e0b13e;
}
:root[data-theme="light"]{
  --bg:#faf8f3; --fg:#2b2a27; --dim:#8a857a; --line:#e6e1d6;
  --code-bg:#fffdf8; --ln:#b8b2a4;
  --y:#b8751a; --y-mark:rgba(255,176,0,.16);
  --r:#c45a38; --r-mark:rgba(216,90,56,.13);
  --b:#4a74b8; --b-mark:rgba(90,141,214,.15);
  --card-bg:#fffef9;
  --syn-kw:#8a4bb0; --syn-str:#a05a12; --syn-num:#b85a00; --syn-fn:#2d6cb5;
  --syn-op:#4a5568; --syn-com:#8a857a; --syn-var:#a06a00;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:"Hiragino Sans","Noto Sans CJK JP",system-ui,sans-serif;
  font-size:15px;line-height:1.7}
.wrap{max-width:1500px;margin:0 auto;padding:24px 20px 80px}
header h1{font-size:20px;margin:0 0 4px;font-family:ui-monospace,monospace}
header .sum{color:var(--dim);margin:0 0 14px;max-width:1100px}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px;font-size:13px}
.legend .chip{border:1.5px solid var(--line);padding:6px 12px;background:var(--card-bg);border-radius:8px}
.legend .c1 b{color:var(--y)} .legend .c2 b{color:var(--r)} .legend .c3 b{color:var(--b)}
/* entry & flow sections — plain rectangles, full width */
#flow,#entry{width:100%;border:1.5px solid var(--line);background:var(--card-bg);
  border-radius:10px;padding:14px 18px;margin:0 0 16px;font-size:13.5px}
#flow h2,#entry h2{margin:0 0 8px;font-size:14px;font-weight:600}
#entry .enote{margin:8px 0 0;padding-left:1.2em;color:var(--dim);font-size:12.5px}
#entry .enote li{margin:2px 0}
/* entry: stack trace */
.stack{margin:8px 0 2px}
.stack .snode{display:inline-block;border:1.5px solid var(--fg);opacity:.88;padding:2px 10px;
  font-family:ui-monospace,monospace;font-size:12px;background:var(--code-bg);border-radius:8px}
.stack .loc{font-size:10.5px;color:var(--dim);margin-left:8px;font-family:ui-monospace,monospace}
.stack .sarr{margin:1px 0 1px 22px;color:var(--dim)}
#flow .intro{margin:0 0 4px}
#flow ol{margin:0;padding-left:1.6em}
#flow li{margin:4px 0}
.lnref{color:var(--r);cursor:pointer;text-decoration:underline dotted;
  font-family:ui-monospace,monospace;font-size:12px;white-space:nowrap}
/* hand-drawn figure */
.fig{margin:10px 0 4px}
.fig .frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.fig .node{border:1.5px solid var(--fg);opacity:.85;padding:2px 10px;
  font-family:ui-monospace,monospace;font-size:12px;border-radius:8px;background:var(--code-bg)}
.fig .arrow{display:flex;flex-direction:column;align-items:center;min-width:60px}
.fig .arrow .albl{font-size:11px;color:var(--dim);font-family:var(--hand);
  transform:rotate(-2deg);margin-bottom:-4px}
.fig .cap{font-size:12px;color:var(--dim);margin-top:2px}
/* layout: sidebar + code + notes */
#topbar{display:none;margin:0 0 10px}
#topbar select{max-width:100%;font-size:13px;padding:5px 8px;border:1.5px solid var(--line);
  background:var(--card-bg);color:var(--fg);border-radius:8px}
#board{position:relative;display:flex;align-items:flex-start;gap:18px}
#sidebar{flex:0 0 250px;border:1.5px solid var(--line);background:var(--card-bg);
  border-radius:10px;align-self:flex-start;position:sticky;top:14px;
  max-height:calc(100vh - 28px);overflow-y:auto}
#sidebar .shead{padding:8px 12px;font-size:11.5px;font-weight:600;color:var(--dim);
  border-bottom:1.5px dashed var(--line);font-family:ui-monospace,monospace;
  position:sticky;top:0;background:var(--card-bg)}
.sdir{display:flex;align-items:center;gap:6px;padding:5px 0;cursor:pointer;
  font-size:12.5px;font-weight:600;border-bottom:1px dashed var(--line)}
.sdir .dname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sfile{display:flex;align-items:center;gap:8px;padding:7px 0;cursor:pointer;
  border-bottom:1px dashed var(--line)}
.sfile:hover{background:rgba(128,120,90,.08)}
.sfile.active{background:var(--y-mark)}
.sfile .tri{font-size:10px;color:var(--dim);width:10px;flex:0 0 auto}
.sfile.viewed .fname{text-decoration:line-through;color:var(--dim)}
.sfile .fname{flex:1;min-width:0;font-family:ui-monospace,monospace;font-size:11.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.sfile .flines{color:var(--dim);font-size:10.5px;font-family:ui-monospace,monospace;flex:0 0 auto}
.sfile input{accent-color:#b8751a;cursor:pointer;flex:0 0 auto}
#mainarea{flex:1;min-width:0}
#codearea{padding:0}
.filewrap{border:1.5px solid var(--line);border-radius:10px;margin-bottom:16px;
  overflow:hidden;background:var(--code-bg)}
#notes{width:330px;flex:0 0 330px;position:relative;min-height:100px}
#overlay{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;z-index:5}
.filehead{padding:8px 14px;font-family:ui-monospace,monospace;font-size:13px;
  font-weight:600;color:var(--dim);border-bottom:1.5px solid var(--line);
  display:flex;align-items:center;gap:8px;cursor:pointer;background:rgba(128,120,90,.06);
  border-radius:10px 10px 0 0}
.filehead:hover{background:rgba(128,120,90,.11)}
.filehead .ftri{font-size:11px;width:12px;flex:0 0 auto;color:var(--dim)}
.filehead .fname{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filehead .viewedchk{margin-left:auto;font-size:11px;font-weight:400}
.filehead .viewedchk input{accent-color:#b8751a;cursor:pointer}
.flines{padding:0}
.line{display:flex;padding-right:14px}
.line:hover{background:rgba(128,120,90,.06)}
.ln{flex:0 0 3.2em;text-align:right;padding-right:1.2em;color:var(--ln);
  user-select:none;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;line-height:1.85}
.lc{white-space:pre-wrap;min-width:0;overflow-wrap:break-word;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;line-height:1.85}
/* neat-annotations style mark */
mark{color:inherit;border-radius:3px;cursor:pointer;background:var(--y-mark);
  box-shadow:-0.15em 0 0 0 var(--y-mark),0.15em 0 0 0 var(--y-mark);
  border-bottom:1.5px dotted var(--y)}
mark.lv2{background:var(--r-mark);
  box-shadow:-0.15em 0 0 0 var(--r-mark),0.15em 0 0 0 var(--r-mark);
  border-bottom:1.5px solid var(--r)}
/* trace: blue data scribble */
.trace{background:var(--b-mark);
  box-shadow:-0.15em 0 0 0 var(--b-mark),0.15em 0 0 0 var(--b-mark);
  border-bottom:1.5px dotted var(--b);border-radius:3px;cursor:pointer;margin-left:1.6em;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11.5px;color:var(--dim);
  white-space:pre-wrap}
.trace::before{content:"⟵ ";opacity:.7}
/* syntax highlighting tokens (prism) */
.token.comment,.token.prolog,.token.doctype,.token.cdata{color:var(--syn-com);font-style:italic}
.token.punctuation{opacity:.8}
.token.keyword,.token.atrule,.token.boolean,.token.constant,.token.tag,.token.selector{color:var(--syn-kw)}
.token.number,.token.unit{color:var(--syn-num)}
.token.string,.token.string-literal,.token.char,.token.attr-value,.token.regex,
.token.template-string,.token.heredoc-string,.token.command-literal,.token.triple-quoted-string{color:var(--syn-str)}
.token.function,.token.class-name,.token.builtin,.token.method-definition{color:var(--syn-fn)}
.token.method-definition .token.keyword{color:var(--syn-kw)}
.token.operator,.token.entity,.token.url{color:var(--syn-op)}
.token.variable,.token.symbol,.token.property,.token.parameter{color:var(--syn-var)}
/* margin note card */
.card{background:var(--card-bg);border:1.5px solid var(--r);border-radius:10px;
  padding:9px 14px 10px;font-size:13px;line-height:1.6}
.card.warn{border-color:var(--y)}
#notes .card{position:absolute;left:0;width:100%}
.card h3{margin:0 0 4px;font-size:13px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  font-weight:600}
.card h3 .tag{color:var(--r);font-weight:600}
.card.warn h3 .tag{color:var(--y)}
.card h3 code{font-family:ui-monospace,monospace;font-size:12px;color:var(--dim);font-weight:400}
.card h3 .lno{color:var(--dim);font-size:10.5px;font-family:ui-monospace,monospace;
  cursor:pointer;text-decoration:underline dotted;margin-left:auto}
.card .txt{margin:0 0 4px}
.card .txt code,#flow code,.card .ex code,#tip code{font-family:ui-monospace,monospace;font-size:12px;
  background:rgba(128,120,90,.12);padding:1px 4px;border-radius:4px}
.card .ex{font-family:ui-monospace,monospace;font-size:11.5px;white-space:pre-wrap;
  background:rgba(128,120,90,.09);padding:5px 9px;border-radius:6px;overflow-x:auto}
.card .ref{margin-top:5px;font-size:11.5px}
.card .ref a{color:var(--dim)}
.card.flash{animation:fl 1s}
@keyframes fl{0%{box-shadow:0 0 0 4px var(--r-mark)}100%{box-shadow:none}}
.line.flash{animation:lfl 1.2s}
@keyframes lfl{0%{background:var(--r-mark)}100%{background:none}}
/* inline (narrow screen) card placement */
#codearea .card{margin:8px 14px 10px calc(3.2em + 14px);max-width:620px}
/* tooltip */
#tip{position:absolute;z-index:10;max-width:380px;font-size:12.5px;line-height:1.55;
  background:var(--card-bg);border:1.5px solid var(--y);color:var(--fg);border-radius:10px;
  padding:7px 12px;pointer-events:none;display:none}
#tip b{color:var(--y);font-size:11.5px;display:block}
#tip .tipex{font-family:ui-monospace,monospace;font-size:11.5px;display:block;
  margin-top:3px;color:var(--dim);white-space:pre-wrap}
footer{margin-top:26px;color:var(--dim);font-size:12px}
@media (max-width:1100px){
  #topbar{display:block}
  #sidebar,#notes,#overlay{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="h-title"></h1>
    <p class="sum" id="h-sum"></p>
    <div class="legend">
      <span class="chip c1"><b>🟡 注意</b> — 罠がある構文。<u>ホバー/タップ</u>でメモ表示</span>
      <span class="chip c2"><b>🔴 警告</b> — 知らないと推測不能な構文。右の欄外カード参照</span>
      <span class="chip c3"><b>🔵 データ</b> — この時点の実データ。ホバーで出どころを表示</span>
    </div>
    <div id="entry" hidden></div>
    <div id="flow" hidden></div>
  </header>
  <div id="topbar"><select id="filesel"></select></div>
  <div id="board">
    <div id="sidebar"><div class="shead">ファイル</div></div>
    <div id="mainarea"><div id="codearea"><div id="code"></div></div></div>
    <div id="notes"></div>
    <svg id="overlay"></svg>
  </div>
  <div id="tip"></div>
  <footer id="foot"></footer>
</div>

<script type="text/plain" id="src">__SRC__</script>
<script type="application/json" id="meta">__META__</script>

<script>
(function(){
"use strict";
const meta = JSON.parse(document.getElementById("meta").textContent);
const ANN = meta.ann || {};
document.getElementById("h-title").textContent = meta.title || "";
document.title = "annotate: " + (meta.title || "");
document.getElementById("h-sum").textContent = meta.summary || "";

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function inline(s){ return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }
/* prism (vendored above). No Prism = plain text. */
const PRISM = typeof Prism !== "undefined" ? Prism : null;
const EXT_LANG = {rb:"ruby", rake:"ruby", erb:"erb", js:"javascript", mjs:"javascript",
  ts:"typescript", tsx:"typescript", sh:"bash", zsh:"bash", bash:"bash",
  go:"go", tf:"hcl", tfvars:"hcl", py:"python", sql:"sql", yml:"yaml", yaml:"yaml",
  json:"json", md:"markdown", css:"css", html:"markup", er:"erb"};
function langFor(path){
  const ext = (path.match(/\.([A-Za-z0-9]+)$/) || [])[1];
  return EXT_LANG[ext] || null;
}
let seed = 7;
function rnd(){ seed = (seed*1103515245+12345) & 0x7fffffff; return seed/0x7fffffff; }
function j(v){ return (rnd()-0.5)*2*v; }

/* ---- parse #src into per-file chunks ---- */
let raw = document.getElementById("src").textContent;
raw = raw.replace(/^\n/,"").replace(/\n[ \t]*$/,"");
const codeEl = document.getElementById("code");
const notesEl = document.getElementById("notes");
const files = [];                 // {path, lines:[lineEl], cards:[{lineEl,anchorEl,cardEl}], wrap}
const firstCardOf = {};           // "fileIdx:id" -> cardEl
const fileSel = document.getElementById("filesel");
let current = -1;
let n1=0, n2=0;

function newFile(path){
  const f = {path, lines: [], cards: [], collapsed: false};
  f.wrap = document.createElement("div");
  f.wrap.className = "filewrap";
  const fh = document.createElement("div");
  fh.className = "filehead";
  const tri = document.createElement("span");
  tri.className = "ftri"; tri.textContent = "▾";
  const name = document.createElement("span");
  name.className = "fname"; name.textContent = "📄 " + path;
  const vc = document.createElement("label");
  vc.className = "viewedchk";
  vc.innerHTML = `<input type="checkbox"> viewed`;
  vc.addEventListener("click", e => e.stopPropagation());
  vc.querySelector("input").addEventListener("change", () => {
    viewed[f.path] = vc.querySelector("input").checked;
    if (f.row) {
      f.row.classList.toggle("viewed", viewed[f.path]);
      f.row.querySelector("input").checked = viewed[f.path];
    }
    saveViewed();
  });
  fh.append(tri, name, vc);
  f.body = document.createElement("div");
  f.body.className = "flines";
  f.wrap.append(fh, f.body);
  codeEl.appendChild(f.wrap);
  files.push(f);
  const opt = document.createElement("option");
  opt.value = files.length - 1;
  opt.textContent = path;
  fileSel.appendChild(opt);
  fh.addEventListener("click", () => toggleFile(files.indexOf(f)));
  return f;
}

raw.split("\n").forEach(text => {
  const fm = text.match(/^⟪(.+)⟫$/);
  if (fm) {
    if (!files.length) return newFile(fm[1]);
    // starting a new file: the previous one must have content
    if (files[files.length-1].lines.length) return newFile(fm[1]);
    files[files.length-1].path = fm[1];
    files[files.length-1].wrap.querySelector(".filehead .fname").textContent = "📄 " + fm[1];
    return;
  }
  let cur = files[files.length-1];
  if (!cur) cur = newFile(meta.title || "source");
  const lang = langFor(cur.path);
  const grammar = lang && PRISM && PRISM.languages[lang] ? PRISM.languages[lang] : null;
  const appendSeg = (el, seg) => {
    if (!seg) return;
    if (grammar) el.insertAdjacentHTML("beforeend", PRISM.highlight(seg, grammar, lang));
    else el.appendChild(document.createTextNode(seg));
  };
  const line = document.createElement("div");
  line.className = "line";
  const ln = document.createElement("span");
  ln.className = "ln"; ln.textContent = cur.lines.length+1;
  const lc = document.createElement("span");
  lc.className = "lc";
  const re = /⟦([A-Za-z0-9_-]+)⟧([\s\S]*?)⟦⟧/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) appendSeg(lc, text.slice(last, m.index));
    const id = m[1], a = ANN[id];
    const mk = document.createElement("mark");
    mk.textContent = m[2];
    if (a && a.lv===2) mk.className = "lv2";
    mk.dataset.id = id;
    lc.appendChild(mk);
    if (a && a.lv===2 && !firstCardOf[files.length-1+":"+id]) {
      const card = makeAnnCard(id, cur.lines.length+1);
      firstCardOf[files.length-1+":"+id] = card;
      cur.cards.push({lineEl: line, anchorEl: mk, cardEl: card, lineNo: cur.lines.length+1});
    }
    last = re.lastIndex;
  }
  if (last < text.length) appendSeg(lc, text.slice(last));
  if (text === "") lc.appendChild(document.createTextNode("​"));
  line.appendChild(ln); line.appendChild(lc);
  cur.body.appendChild(line);
  cur.lines.push(line);
});
for (const id in ANN) (ANN[id].lv===2 ? n2++ : n1++);

/* ---- traces: blue data scribbles ---- */
(meta.trace||[]).forEach(tr => {
  const f = tr.f ?? tr.file ?? 0;
  const file = files[f]; if (!file) return;
  const lineEl = file.lines[tr.line-1]; if (!lineEl) return;
  const sp = document.createElement("span");
  sp.className = "trace";
  sp.textContent = tr.text || "";
  sp.dataset.f = f;
  sp.dataset.ref = tr.ref ?? "";
  lineEl.querySelector(".lc").appendChild(sp);
});

/* ---- warn cards from meta.issues ---- */
(meta.issues||[]).forEach(it => {
  const f = it.f ?? it.file ?? 0;
  const file = files[f]; if (!file) return;
  const lineEl = file.lines[it.line-1]; if (!lineEl) return;
  const c = document.createElement("div");
  c.className = "card warn";
  const h = document.createElement("h3");
  h.innerHTML = `<span class="tag">⚠ 注意</span>`;
  h.appendChild(lnrefEl(f, it.line));
  c.appendChild(h);
  const t = document.createElement("p"); t.className = "txt";
  t.innerHTML = inline(it.text||"");
  c.appendChild(t);
  file.cards.push({lineEl, anchorEl: lineEl.querySelector(".lc"), cardEl: c, lineNo: it.line});
});
document.getElementById("foot").textContent =
  `注釈: 🔴 ${n2} / 🟡 ${n1} / ⚠ ${(meta.issues||[]).length} — ${meta.lang||""}`;

/* ---- sidebar: file tree with viewed checkboxes ---- */
const sidebarEl = document.getElementById("sidebar");
const viewedKey = "annotate-viewed:" + (meta.title||"");
let viewed = {};
try { viewed = JSON.parse(localStorage.getItem(viewedKey) || "{}"); } catch(e){}
function saveViewed(){ try { localStorage.setItem(viewedKey, JSON.stringify(viewed)); } catch(e){} }

/* build path trie: root.dirs = {name: node}, node.files = [fileIdx] */
const root = {dirs: {}, files: []};
const rootEl = document.createElement("div");
files.forEach((f, i) => {
  const parts = f.path.split("/");
  let node = root;
  parts.slice(0, -1).forEach(p => {
    node.dirs[p] = node.dirs[p] || {dirs: {}, files: []};
    node = node.dirs[p];
  });
  node.files.push(i);
});

/* nested, collapsible directory tree (GitHub-like) */
const open = new Set();
(function collect(n, p){
  Object.keys(n.dirs).forEach(k => {
    const key = p ? p + "/" + k : k;
    open.add(key);
    collect(n.dirs[k], key);
  });
})(root, "");

function buildTree(n, depth, prefix){
  const frag = document.createDocumentFragment();
  Object.keys(n.dirs).forEach(name => {
    const child = n.dirs[name];
    const key = prefix ? prefix + "/" + name : name;
    const row = document.createElement("div");
    row.className = "sdir";
    row.style.paddingLeft = (10 + depth * 13) + "px";
    row.innerHTML = `<span class="tri">▾</span><span class="dname"></span>`;
    const dn = row.querySelector(".dname");
    dn.textContent = name;
    dn.title = key;
    const childWrap = document.createElement("div");
    childWrap.appendChild(buildTree(child, depth + 1, key));
    row.addEventListener("click", () => {
      const isOpen = open.has(key);
      if (isOpen) open.delete(key); else open.add(key);
      row.querySelector(".tri").textContent = isOpen ? "▸" : "▾";
      childWrap.style.display = isOpen ? "none" : "";
    });
    frag.appendChild(row);
    frag.appendChild(childWrap);
  });
  n.files.forEach(i => {
    const f = files[i];
    const row = document.createElement("div");
    row.className = "sfile";
    row.style.paddingLeft = (10 + depth * 13) + "px";
    row.innerHTML = `<span class="tri">▸</span><input type="checkbox"><span class="fname"></span><span class="flines"></span>`;
    const fn = row.querySelector(".fname");
    fn.textContent = f.path.split("/").pop();
    fn.title = f.path;
    row.querySelector(".flines").textContent = f.lines.length + "行";
    const chk = row.querySelector("input");
    chk.checked = !!viewed[f.path];
    if (chk.checked) row.classList.add("viewed");
    chk.addEventListener("click", e => e.stopPropagation());
    chk.addEventListener("change", () => {
      viewed[f.path] = chk.checked;
      row.classList.toggle("viewed", chk.checked);
      saveViewed();
    });
    row.addEventListener("click", () => reveal(i));
    f.row = row;
    frag.appendChild(row);
  });
  return frag;
}
rootEl.appendChild(buildTree(root, 0, ""));
sidebarEl.appendChild(rootEl);

function select(i){
  if (i < 0 || i >= files.length) return;
  current = i;
  files.forEach((f, j) => {
    if (!f.row) return;
    f.row.classList.toggle("active", j === i);
    f.row.querySelector(".tri").textContent = j === i ? "▾" : "▸";
  });
  const vc = files[i].wrap.querySelector(".filehead .viewedchk input");
  vc.checked = !!viewed[files[i].path];
  // detach previous cards, attach active file's
  (files.flatMap(f => f.cards)).forEach(ci => ci.cardEl.parentNode && ci.cardEl.parentNode.removeChild(ci.cardEl));
  if (document.documentElement.clientWidth > 1100) files[i].cards.forEach(ci => notesEl.appendChild(ci.cardEl));
  else files[i].cards.forEach(ci => ci.lineEl.after(ci.cardEl));
  fileSel.value = i;
  layout();
}

function detachActiveCards(){
  if (current >= 0) files[current].cards.forEach(ci => ci.cardEl.parentNode && ci.cardEl.parentNode.removeChild(ci.cardEl));
}
function toggleFile(i){
  const f = files[i];
  f.collapsed = !f.collapsed;
  f.body.style.display = f.collapsed ? "none" : "";
  f.wrap.querySelector(".ftri").textContent = f.collapsed ? "▸" : "▾";
  if (f.collapsed && i === current) { detachActiveCards(); layout(); }
}

function reveal(i){
  if (i < 0 || i >= files.length) return;
  if (files[i].collapsed) toggleFile(i);
  select(i);
  files[i].wrap.scrollIntoView({behavior: "smooth", block: "start"});
}
fileSel.addEventListener("change", () => reveal(parseInt(fileSel.value, 10)));

/* ---- line jumping ---- */
function flashLine(f, l){
  if (f === undefined || f === null) f = 0;
  if (files[f] && files[f].collapsed) toggleFile(f);
  if (f !== current) select(f);
  const el = (files[f]||{}).lines ? files[f].lines[l-1] : null;
  if (!el) return;
  el.scrollIntoView({behavior:"smooth", block:"center"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}
function lnrefEl(f, l){
  const a = document.createElement("span"); a.className = "lnref";
  a.textContent = "L"+l; a.title = "該当行へ";
  a.onclick = () => flashLine(f, l);
  return a;
}

/* ---- entry section: 呼び出し経路 ---- */
const entryEl = document.getElementById("entry");
if (meta.entry && (meta.entry.stack || meta.entry.tree)) {
  entryEl.hidden = false;
  entryEl.innerHTML = `<h2>${esc(meta.entry.title || "呼び出し経路")}</h2>`;
  if (meta.entry.stack) {
    const w = document.createElement("div"); w.className = "stack";
    meta.entry.stack.forEach((st, i) => {
      if (i > 0) {
        const a = document.createElement("div"); a.className = "sarr";
        a.innerHTML = `<svg width="16" height="26" viewBox="0 0 16 26" aria-hidden="true">
          <path d="M ${8+j(1)} 2 Q ${8+j(2)} 13 ${8+j(1)} 20" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".7"/>
          <path d="M ${3.5+j(1)} ${15+j(1)} L 8 22 L ${12.5+j(1)} ${15+j(1)}" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/></svg>`;
        w.appendChild(a);
      }
      const row = document.createElement("div");
      const n = document.createElement("span"); n.className = "snode"; n.textContent = st.t || "";
      row.appendChild(n);
      if (st.loc) { const l = document.createElement("span"); l.className = "loc"; l.textContent = st.loc; row.appendChild(l); }
      w.appendChild(row);
    });
    entryEl.appendChild(w);
  }
  if (meta.entry.tree) {
    const w = document.createElement("div"); w.className = "tree";
    const build = node => {
      const li = document.createElement("li");
      if (node.here) li.className = "here";
      const n = document.createElement("span"); n.className = "tn"; n.textContent = node.t || "";
      li.appendChild(n);
      if (node.loc) { const l = document.createElement("span"); l.className = "loc"; l.textContent = " " + node.loc;
        l.style.cssText = "font-size:10.5px;color:var(--dim);font-family:ui-monospace,monospace"; li.appendChild(l); }
      if (node.c && node.c.length) {
        const ul = document.createElement("ul");
        node.c.forEach(ch => ul.appendChild(build(ch)));
        li.appendChild(ul);
      }
      return li;
    };
    const root = document.createElement("ul");
    root.appendChild(build(meta.entry.tree));
    w.appendChild(root);
    entryEl.appendChild(w);
  }
  if (meta.entry.note) {
    const ul = document.createElement("ul"); ul.className = "enote";
    meta.entry.note.split("\n").forEach(line => {
      const t = line.trim(); if (!t) return;
      const li = document.createElement("li");
      li.innerHTML = inline(t);
      ul.appendChild(li);
    });
    entryEl.appendChild(ul);
  }
}

/* ---- flow section: 処理の流れ ---- */
const flowEl = document.getElementById("flow");
if (meta.flow && (meta.flow.steps||[]).length) {
  flowEl.hidden = false;
  flowEl.innerHTML = `<h2>${esc(meta.flow.title || "処理の流れ")}</h2>`;
  if (meta.flow.intro) { const p = document.createElement("p"); p.className = "intro"; p.innerHTML = inline(meta.flow.intro); flowEl.appendChild(p); }
  const ol = document.createElement("ol");
  meta.flow.steps.forEach(st => {
    const li = document.createElement("li");
    li.innerHTML = inline(st.t||"");
    if (st.l) { li.appendChild(document.createTextNode("　")); li.appendChild(lnrefEl(st.f, st.l)); }
    ol.appendChild(li);
  });
  flowEl.appendChild(ol);
  if (meta.flow.fig) flowEl.appendChild(makeFig(meta.flow.fig));
}

function makeFig(fig){
  const w = document.createElement("div"); w.className = "fig";
  (fig.rows||[]).forEach(row => {
    const r = document.createElement("div"); r.className = "frow";
    const [a, label, b] = row;
    const na = document.createElement("span"); na.className = "node"; na.textContent = a;
    r.appendChild(na);
    const ar = document.createElement("span"); ar.className = "arrow";
    if (label) { const l = document.createElement("span"); l.className = "albl"; l.textContent = label; ar.appendChild(l); }
    ar.insertAdjacentHTML("beforeend", roughArrowSVG());
    r.appendChild(ar);
    if (b !== undefined) { const nb = document.createElement("span"); nb.className = "node"; nb.textContent = b; r.appendChild(nb); }
    w.appendChild(r);
  });
  if (fig.caption) { const c = document.createElement("div"); c.className = "cap"; c.textContent = fig.caption; w.appendChild(c); }
  return w;
}

function makeAnnCard(id, lineNo){
  const a = ANN[id];
  const c = document.createElement("div");
  c.className = "card"; c.id = "card-"+id;
  const h = document.createElement("h3");
  h.innerHTML = `<span class="tag">${esc(a.name||id)}</span>` +
    (a.syn ? `<code>${esc(a.syn)}</code>` : "");
  const lno = document.createElement("span");
  lno.className = "lno"; lno.textContent = "L"+lineNo; lno.title = "該当行へ";
  h.appendChild(lno);
  c.appendChild(h);
  if (a.what) { const t = document.createElement("p"); t.className = "txt"; t.innerHTML = inline(a.what); c.appendChild(t); }
  if (a.ex) { const d = document.createElement("div"); d.className = "ex"; d.textContent = a.ex; c.appendChild(d); }
  if (a.fig) c.appendChild(makeFig(a.fig));
  if (a.ref) {
    const r = document.createElement("div"); r.className = "ref";
    const link = document.createElement("a");
    link.href = a.ref; link.target = "_blank"; link.rel = "noopener";
    link.textContent = "📖 " + a.ref.replace(/^https?:\/\//,"").replace(/#.*$/,"");
    r.appendChild(link); c.appendChild(r);
  }
  return c;
}

/* wire card line-jump */
files.forEach((f, fi) => f.cards.forEach(ci => {
  const lno = ci.cardEl.querySelector(".lno");
  if (lno) lno.onclick = () => flashLine(fi, ci.lineNo);
}));

/* ---- layout: margin notes (wide) / inline (narrow) ---- */
const board = document.getElementById("board");
const codearea = document.getElementById("codearea");
const overlay = document.getElementById("overlay");
let marginMode = null;

function currentCards(){ return current >= 0 ? files[current].cards : []; }

function layout(){
  const wide = document.documentElement.clientWidth > 1100;
  if (wide !== marginMode) {
    marginMode = wide;
    files.forEach((f, fi) => {
      if (fi === current) {
        f.cards.forEach(ci => {
          if (wide) notesEl.appendChild(ci.cardEl);
          else ci.lineEl.after(ci.cardEl);
        });
      }
    });
  }
  if (!wide) { overlay.innerHTML = ""; return; }
  const boardTop = board.getBoundingClientRect().top;
  let prevBottom = 0;
  currentCards().forEach(ci => {
    const y = ci.lineEl.getBoundingClientRect().top - boardTop;
    const top = Math.max(y - 4, prevBottom);
    ci.cardEl.style.top = top + "px";
    prevBottom = top + ci.cardEl.offsetHeight + 14;
  });
  notesEl.style.minHeight = prevBottom + "px";
  draw();
}

/* ---- hand-drawn connector arrows ---- */
function strokeColor(warn){
  return getComputedStyle(document.documentElement).getPropertyValue(warn ? "--y" : "--r").trim();
}
function roughArrowSVG(){
  seed = (seed*31+7) & 0x7fffffff;
  const y = 12;
  let d = `M 3 ${y+j(1)}`;
  for (let x=18; x<=54; x+=18) d += ` Q ${x-9+j(2)} ${y+j(2.2)} ${x+j(1)} ${y+j(1.5)}`;
  return `<svg width="60" height="24" viewBox="0 0 60 24" aria-hidden="true">
    <path d="${d}" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".7"/>
    <path d="M ${46+j(1)} ${y-5+j(1)} L 55 ${y} L ${46+j(1)} ${y+5+j(1)}" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
  </svg>`;
}
function draw(){
  overlay.innerHTML = ""; seed = 7;
  const b = board.getBoundingClientRect();
  overlay.setAttribute("width", b.width);
  overlay.setAttribute("height", board.scrollHeight);
  const caRect = codearea.getBoundingClientRect();
  currentCards().forEach((ci, idx) => {
    const warn = ci.cardEl.classList.contains("warn");
    const mr = ci.anchorEl.getBoundingClientRect();
    if (mr.right > caRect.right - 8 || mr.left < caRect.left + 46) return; // scrolled out
    const cr = ci.cardEl.getBoundingClientRect();
    const x1 = cr.left - b.left - 5,  y1 = cr.top - b.top + 16;
    const x2 = Math.min(mr.right, caRect.right - 20) - b.left + 6;
    const y2 = mr.bottom - b.top - 1;
    const gx = caRect.right - b.left + 7 + (idx % 4) * 4 + j(2);
    let d;
    if (Math.abs(y1 - y2) < 14) {
      d = `M ${x1} ${y1} C ${x1-40+j(6)} ${y1+j(4)}, ${x2+50+j(6)} ${y2+j(3)}, ${x2+3} ${y2}`;
    } else {
      d = `M ${x1} ${y1} Q ${gx+j(4)} ${y1+j(4)} ${gx+j(2)} ${y1+(y2>y1?18:-18)}`
        + ` L ${gx+j(2)} ${y2+(y2>y1?-16:16)}`
        + ` Q ${gx+j(4)} ${y2+j(3)} ${x2+3} ${y2+j(1)}`;
    }
    addPath(d, 1.4, .6, warn);
    for (const dy of [-5.5, 5.5]) {
      addPath(`M ${x2+11+j(1.2)} ${y2+dy+j(1.2)} L ${x2+1} ${y2}`, 1.4, .6, warn);
    }
  });
}
function addPath(d, w, op, warn){
  const p = document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d", d);
  p.setAttribute("stroke", strokeColor(warn));
  p.setAttribute("stroke-width", w); p.setAttribute("fill", "none");
  p.setAttribute("stroke-linecap", "round"); p.setAttribute("opacity", op);
  overlay.appendChild(p);
}

/* ---- tooltip: L1 detail, L2 card jump, trace ref ---- */
const tip = document.getElementById("tip");
let pinnedMark = null;
function showTip(mk){
  const a = ANN[mk.dataset.id]; if (!a) return;
  if (a.lv===2) {
    tip.innerHTML = `<b style="color:var(--r)">🔴 ${esc(a.name||"")}</b>クリックでカードへ`;
  } else {
    tip.innerHTML = `<b>🟡 ${esc(a.name||"")}</b>${inline(a.what||"")}` +
      (a.ex ? `<span class="tipex">${esc(a.ex)}</span>` : "");
  }
  showTipAt(mk);
}
function showTraceTip(el){
  const f = parseInt(el.dataset.f||0), ref = parseInt(el.dataset.ref||0);
  tip.innerHTML = `<b style="color:var(--b)">🔵 この時点の実データ</b>` +
    (ref ? `出どころ <span class="lnref">L${ref}</span>（クリックで移動）` : "");
  const r = document.createElement("span"); r.className = "tipex"; r.textContent = el.textContent.replace(/^⟵ /,"");
  tip.appendChild(r);
  showTipAt(el);
  const refEl = tip.querySelector(".lnref");
  if (refEl) refEl.onclick = () => { hideTip(); flashLine(f, ref); };
}
function showTipAt(el){
  tip.style.display = "block";
  const r = el.getBoundingClientRect();
  const x = r.left + window.scrollX, y = r.bottom + window.scrollY + 8;
  tip.style.left = Math.min(x, window.scrollX + document.documentElement.clientWidth - tip.offsetWidth - 12) + "px";
  tip.style.top = y + "px";
}
function hideTip(){ tip.style.display = "none"; }
document.addEventListener("mouseover", e => {
  if (pinnedMark) return;
  const tr = e.target.closest(".trace");
  if (tr) { showTraceTip(tr); return; }
  const mk = e.target.closest("mark");
  if (mk) showTip(mk); else hideTip();
});
document.addEventListener("mouseout", e => { if (!pinnedMark && e.target.closest("mark")) hideTip(); });
document.addEventListener("click", e => {
  const tr = e.target.closest(".trace");
  if (tr) { const f = parseInt(tr.dataset.f||0), ref = parseInt(tr.dataset.ref||0); if (ref) flashLine(f, ref); return; }
  const mk = e.target.closest("mark");
  if (!mk) {
    if (pinnedMark) { pinnedMark = null; hideTip(); }
    return;
  }
  const a = ANN[mk.dataset.id]; if (!a) return;
  if (a.lv===2) {
    pinnedMark = null; hideTip();
    const c = firstCardOf[current+":"+mk.dataset.id];
    if (c) { c.scrollIntoView({behavior:"smooth", block:"center"});
      c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash"); }
  } else if (pinnedMark === mk) {
    pinnedMark = null; hideTip();
  } else {
    pinnedMark = mk; showTip(mk);
  }
});

window.addEventListener("resize", () => { clearTimeout(layout._t); layout._t = setTimeout(layout, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
window.addEventListener("load", layout);
select(0);
const io = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (!en.isIntersecting) return;
    const fi = files.findIndex(f => f.wrap === en.target);
    if (fi >= 0 && fi !== current && !files[fi].collapsed) select(fi);
  });
}, {rootMargin: "-35% 0px -55% 0px"});
files.forEach(f => io.observe(f.wrap));
})();
</script>
</body>
</html>

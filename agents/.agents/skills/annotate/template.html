<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>annotate</title>
<style>
/* mark style adapted from neat-annotations (MIT) https://github.com/syabro/neat-annotations */
:root{
  color-scheme: light dark;
  --bg:#faf8f3; --fg:#2b2a27; --dim:#8a857a; --line:#e6e1d6;
  --code-bg:#fffdf8; --ln:#b8b2a4;
  --y:#b8751a; --y-mark:rgba(255,176,0,.16);
  --r:#c45a38; --r-mark:rgba(216,90,56,.13);
  --card-bg:#fffef9;
  --hand:"Shantell Sans","Hiragino Maru Gothic ProN","BIZ UDGothic",cursive,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1e1d1a; --fg:#e8e4da; --dim:#96917f; --line:#3a382f;
    --code-bg:#232219; --ln:#5f5a4c;
    --y:#e0b13e; --y-mark:rgba(224,177,62,.20);
    --r:#e07a5a; --r-mark:rgba(224,110,80,.18);
    --card-bg:#2a2822;
  }
}
:root[data-theme="dark"]{
  --bg:#1e1d1a; --fg:#e8e4da; --dim:#96917f; --line:#3a382f;
  --code-bg:#232219; --ln:#5f5a4c;
  --y:#e0b13e; --y-mark:rgba(224,177,62,.20);
  --r:#e07a5a; --r-mark:rgba(224,110,80,.18);
  --card-bg:#2a2822;
}
:root[data-theme="light"]{
  --bg:#faf8f3; --fg:#2b2a27; --dim:#8a857a; --line:#e6e1d6;
  --code-bg:#fffdf8; --ln:#b8b2a4;
  --y:#b8751a; --y-mark:rgba(255,176,0,.16);
  --r:#c45a38; --r-mark:rgba(216,90,56,.13);
  --card-bg:#fffef9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:"Hiragino Sans","Noto Sans CJK JP",system-ui,sans-serif;
  font-size:15px;line-height:1.7}
.wrap{max-width:1360px;margin:0 auto;padding:24px 20px 80px}
header h1{font-size:20px;margin:0 0 4px;font-family:ui-monospace,monospace}
header .sum{color:var(--dim);margin:0 0 14px;max-width:900px}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px;font-size:13px}
.legend .chip{border:1.5px solid var(--line);padding:6px 12px;background:var(--card-bg);
  border-radius:255px 15px 225px 15px/15px 225px 15px 255px}
.legend .c1 b{color:var(--y)} .legend .c2 b{color:var(--r)}
/* flow section */
#flow{max-width:760px;border:1.5px solid var(--line);background:var(--card-bg);
  border-radius:15px 255px 15px 225px/225px 15px 255px 15px;
  padding:12px 18px;margin:0 0 18px;font-size:13.5px}
#flow h2{margin:0 0 6px;font-size:13.5px;font-family:var(--hand);transform:rotate(-0.8deg)}
#flow .intro{margin:0 0 4px}
#flow ol{margin:0;padding-left:1.6em}
#flow li{margin:4px 0}
.lnref{color:var(--r);cursor:pointer;text-decoration:underline dotted;
  font-family:ui-monospace,monospace;font-size:12px;white-space:nowrap}
/* hand-drawn figure */
.fig{margin:10px 0 4px}
.fig .frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.fig .node{border:1.5px solid var(--fg);opacity:.85;padding:2px 10px;
  font-family:ui-monospace,monospace;font-size:12px;
  border-radius:255px 15px 225px 15px/15px 225px 15px 255px;background:var(--code-bg)}
.fig .arrow{display:flex;flex-direction:column;align-items:center;min-width:60px}
.fig .arrow .albl{font-size:11px;color:var(--dim);font-family:var(--hand);
  transform:rotate(-2deg);margin-bottom:-4px}
.fig .cap{font-size:12px;color:var(--dim);margin-top:2px;font-family:var(--hand)}
/* board = code + margin notes + overlay */
#board{position:relative;display:flex;align-items:flex-start;gap:26px}
#codearea{flex:1;min-width:0;overflow-x:auto;border:1.5px solid var(--line);
  background:var(--code-bg);border-radius:8px;padding:14px 0}
#notes{width:360px;flex:0 0 360px;position:relative;min-height:100px}
#overlay{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;z-index:5}
.filehead{padding:10px 14px 4px;font-family:ui-monospace,monospace;font-size:13px;
  font-weight:600;color:var(--dim);border-bottom:1px dashed var(--line);margin-bottom:4px}
.line{display:flex;min-width:max-content;padding-right:14px}
.line:hover{background:rgba(128,120,90,.06)}
.ln{flex:0 0 3.2em;text-align:right;padding-right:1.2em;color:var(--ln);
  user-select:none;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;line-height:1.85}
.lc{white-space:pre;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;line-height:1.85}
/* neat-annotations style mark */
mark{color:inherit;border-radius:3px;cursor:pointer;background:var(--y-mark);
  box-shadow:-0.15em 0 0 0 var(--y-mark),0.15em 0 0 0 var(--y-mark);
  border-bottom:1.5px dotted var(--y)}
mark.lv2{background:var(--r-mark);
  box-shadow:-0.15em 0 0 0 var(--r-mark),0.15em 0 0 0 var(--r-mark);
  border-bottom:1.5px solid var(--r)}
/* margin note card */
.card{background:var(--card-bg);border:1.5px solid var(--r);
  border-radius:255px 15px 225px 15px/15px 225px 15px 255px;
  padding:9px 14px 10px;font-size:13px;line-height:1.6}
.card.warn{border-color:var(--y)}
#notes .card{position:absolute;left:0;width:100%}
.card h3{margin:0 0 4px;font-size:13px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  font-family:var(--hand);transform:rotate(-1.2deg)}
.card h3 .tag{color:var(--r);font-weight:600}
.card.warn h3 .tag{color:var(--y)}
.card h3 code{font-family:ui-monospace,monospace;font-size:12px;color:var(--dim);font-weight:400}
.card h3 .lno{color:var(--dim);font-size:10.5px;font-family:ui-monospace,monospace;
  cursor:pointer;text-decoration:underline dotted;margin-left:auto}
.card .txt{margin:0 0 4px}
.card .txt code,#flow code,.card .ex code,#tip code{font-family:ui-monospace,monospace;font-size:12px;
  background:rgba(128,120,90,.12);padding:1px 4px;border-radius:4px}
.card .ex{font-family:ui-monospace,monospace;font-size:11.5px;white-space:pre-wrap;
  background:rgba(128,120,90,.09);padding:5px 9px;border-radius:6px;overflow-x:auto}
.card .ref{margin-top:5px;font-size:11.5px}
.card .ref a{color:var(--dim)}
.card.flash{animation:fl 1s}
@keyframes fl{0%{box-shadow:0 0 0 4px var(--r-mark)}100%{box-shadow:none}}
.line.flash{animation:lfl 1.2s}
@keyframes lfl{0%{background:var(--r-mark)}100%{background:none}}
/* trace: penciled-in data state at end of line */
.trace{margin-left:1.8em;font-family:var(--hand);font-size:11.5px;color:var(--dim);
  white-space:pre;transform:rotate(-0.6deg);display:inline-block}
.trace::before{content:"⟵ ";opacity:.7}
/* inline (narrow screen) card placement */
#codearea .card{margin:8px 14px 10px calc(3.2em + 14px);max-width:620px}
/* tooltip */
#tip{position:absolute;z-index:10;max-width:380px;font-size:12.5px;line-height:1.55;
  background:var(--card-bg);border:1.5px solid var(--y);color:var(--fg);
  border-radius:15px 225px 15px 255px/255px 15px 225px 15px;
  padding:7px 12px;pointer-events:none;display:none}
#tip b{color:var(--y);font-size:11.5px;display:block;font-family:var(--hand)}
#tip .tipex{font-family:ui-monospace,monospace;font-size:11.5px;display:block;
  margin-top:3px;color:var(--dim);white-space:pre-wrap}
footer{margin-top:26px;color:var(--dim);font-size:12px}
@media (max-width:1000px){ #notes,#overlay{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="h-title"></h1>
    <p class="sum" id="h-sum"></p>
    <div class="legend">
      <span class="chip c1"><b>🟡 注意</b> — 罠がある構文。<u>ホバー/タップ</u>でメモ表示</span>
      <span class="chip c2"><b>🔴 警告</b> — 知らないと推測不能な構文。右の欄外カード参照</span>
    </div>
    <div id="flow" hidden></div>
  </header>
  <div id="board">
    <div id="codearea"><div id="code"></div></div>
    <div id="notes"></div>
    <svg id="overlay"></svg>
  </div>
  <div id="tip"></div>
  <footer id="foot"></footer>
</div>

<script type="text/plain" id="src">__SRC__</script>
<script type="application/json" id="meta">__META__</script>

<script>
(function(){
"use strict";
const meta = JSON.parse(document.getElementById("meta").textContent);
const ANN = meta.ann || {};
document.getElementById("h-title").textContent = meta.title || "";
document.title = "annotate: " + (meta.title || "");
document.getElementById("h-sum").textContent = meta.summary || "";

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function inline(s){ return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }
let seed = 7;
function rnd(){ seed = (seed*1103515245+12345) & 0x7fffffff; return seed/0x7fffffff; }
function j(v){ return (rnd()-0.5)*2*v; }

/* ---- parse #src: ⟪path⟫ file delimiters + ⟦id⟧...⟦⟧ markers ---- */
let raw = document.getElementById("src").textContent;
raw = raw.replace(/^\n/,"").replace(/\n[ \t]*$/,"");
const codeEl = document.getElementById("code");
const notesEl = document.getElementById("notes");
const fileLines = [[]];           // fileLines[fileIdx] = [lineEl, ...]
const cardInfo = [];              // {lineEl, anchorEl, cardEl} sorted by code order
const firstCardOf = {};           // ann id -> cardEl
let n1=0, n2=0;

raw.split("\n").forEach(text => {
  const fm = text.match(/^⟪(.+)⟫$/);
  if (fm) {
    if (fileLines[fileLines.length-1].length) fileLines.push([]);
    const fh = document.createElement("div");
    fh.className = "filehead"; fh.textContent = "📄 " + fm[1];
    codeEl.appendChild(fh);
    return;
  }
  const cur = fileLines[fileLines.length-1];
  const line = document.createElement("div");
  line.className = "line";
  const ln = document.createElement("span");
  ln.className = "ln"; ln.textContent = cur.length+1;
  const lc = document.createElement("span");
  lc.className = "lc";
  const re = /⟦([A-Za-z0-9_-]+)⟧([\s\S]*?)⟦⟧/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) lc.appendChild(document.createTextNode(text.slice(last, m.index)));
    const id = m[1], a = ANN[id];
    const mk = document.createElement("mark");
    mk.textContent = m[2];
    if (a && a.lv===2) mk.className = "lv2";
    mk.dataset.id = id;
    lc.appendChild(mk);
    if (a && a.lv===2 && !firstCardOf[id]) {
      const card = makeAnnCard(id, cur.length+1);
      firstCardOf[id] = card;
      cardInfo.push({lineEl: line, anchorEl: mk, cardEl: card});
    }
    last = re.lastIndex;
  }
  if (last < text.length) lc.appendChild(document.createTextNode(text.slice(last)));
  if (text === "") lc.appendChild(document.createTextNode("​"));
  line.appendChild(ln); line.appendChild(lc);
  codeEl.appendChild(line);
  cur.push(line);
});
for (const id in ANN) (ANN[id].lv===2 ? n2++ : n1++);

function lineAt(f, l){ return (fileLines[f||0]||[])[l-1]; }
function flashLine(f, l){
  const el = lineAt(f, l); if (!el) return;
  el.scrollIntoView({behavior:"smooth", block:"center"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}
function lnrefEl(f, l){
  const a = document.createElement("span"); a.className = "lnref";
  a.textContent = "L"+l; a.title = "該当行へ";
  a.onclick = () => flashLine(f, l);
  return a;
}

/* ---- trace: data-in-flight scribbles at end of lines ---- */
(meta.trace||[]).forEach(tr => {
  const lineEl = lineAt(tr.f, tr.line);
  if (!lineEl) return;
  const sp = document.createElement("span");
  sp.className = "trace";
  sp.textContent = tr.text || "";
  lineEl.querySelector(".lc").appendChild(sp);
  if (tr.ref) { sp.appendChild(document.createTextNode(" ")); sp.appendChild(lnrefEl(tr.reff ?? tr.f, tr.ref)); }
});

/* ---- warn cards from meta.issues: placed at their line like ann cards ---- */
(meta.issues||[]).forEach(it => {
  const lineEl = lineAt(it.file, it.line);
  if (!lineEl) return;
  const c = document.createElement("div");
  c.className = "card warn";
  const h = document.createElement("h3");
  h.innerHTML = `<span class="tag">⚠ 注意</span>`;
  h.appendChild(lnrefEl(it.file, it.line));
  c.appendChild(h);
  const t = document.createElement("p"); t.className = "txt";
  t.innerHTML = inline(it.text||"");
  c.appendChild(t);
  cardInfo.push({lineEl, anchorEl: lineEl.querySelector(".lc"), cardEl: c});
});
document.getElementById("foot").textContent =
  `注釈: 🔴 ${n2} / 🟡 ${n1} / ⚠ ${(meta.issues||[]).length} — ${meta.lang||""}`;

function makeFig(fig){
  const w = document.createElement("div"); w.className = "fig";
  (fig.rows||[]).forEach(row => {
    const r = document.createElement("div"); r.className = "frow";
    const [a, label, b] = row;
    const na = document.createElement("span"); na.className = "node"; na.textContent = a;
    r.appendChild(na);
    const ar = document.createElement("span"); ar.className = "arrow";
    if (label) { const l = document.createElement("span"); l.className = "albl"; l.textContent = label; ar.appendChild(l); }
    ar.insertAdjacentHTML("beforeend", roughArrowSVG());
    r.appendChild(ar);
    if (b !== undefined) { const nb = document.createElement("span"); nb.className = "node"; nb.textContent = b; r.appendChild(nb); }
    w.appendChild(r);
  });
  if (fig.caption) { const c = document.createElement("div"); c.className = "cap"; c.textContent = fig.caption; w.appendChild(c); }
  return w;
}

/* ---- flow section ---- */
const flowEl = document.getElementById("flow");
if (meta.flow && (meta.flow.steps||[]).length) {
  flowEl.hidden = false;
  flowEl.innerHTML = "<h2>🧭 流れ — 実例で追う</h2>";
  if (meta.flow.intro) { const p = document.createElement("p"); p.className = "intro"; p.innerHTML = inline(meta.flow.intro); flowEl.appendChild(p); }
  const ol = document.createElement("ol");
  meta.flow.steps.forEach(st => {
    const li = document.createElement("li");
    li.innerHTML = inline(st.t||"");
    if (st.l) { li.appendChild(document.createTextNode("　")); li.appendChild(lnrefEl(st.f, st.l)); }
    ol.appendChild(li);
  });
  flowEl.appendChild(ol);
  if (meta.flow.fig) flowEl.appendChild(makeFig(meta.flow.fig));
}

function makeAnnCard(id, lineNo){
  const a = ANN[id];
  const c = document.createElement("div");
  c.className = "card"; c.id = "card-"+id;
  const h = document.createElement("h3");
  h.innerHTML = `<span class="tag">${esc(a.name||id)}</span>` +
    (a.syn ? `<code>${esc(a.syn)}</code>` : "");
  const lno = document.createElement("span");
  lno.className = "lno"; lno.textContent = "L"+lineNo; lno.title = "該当行へ";
  h.appendChild(lno);
  c.appendChild(h);
  if (a.what) { const t = document.createElement("p"); t.className = "txt"; t.innerHTML = inline(a.what); c.appendChild(t); }
  if (a.ex) { const d = document.createElement("div"); d.className = "ex"; d.textContent = a.ex; c.appendChild(d); }
  if (a.fig) c.appendChild(makeFig(a.fig));
  if (a.ref) {
    const r = document.createElement("div"); r.className = "ref";
    const link = document.createElement("a");
    link.href = a.ref; link.target = "_blank"; link.rel = "noopener";
    link.textContent = "📖 " + a.ref.replace(/^https?:\/\//,"").replace(/#.*$/,"");
    r.appendChild(link); c.appendChild(r);
  }
  return c;
}

/* wire card line-jump after fileLines is complete */
cardInfo.forEach(ci => {
  const lno = ci.cardEl.querySelector(".lno");
  if (lno && !lno.onclick) lno.onclick = () => {
    ci.lineEl.scrollIntoView({behavior:"smooth", block:"center"});
    ci.lineEl.classList.remove("flash"); void ci.lineEl.offsetWidth; ci.lineEl.classList.add("flash");
  };
});

/* ---- layout: margin notes (wide) / inline (narrow) ---- */
const board = document.getElementById("board");
const codearea = document.getElementById("codearea");
const overlay = document.getElementById("overlay");
let marginMode = null;
cardInfo.sort((x, y) => {
  const p = x.lineEl.compareDocumentPosition(y.lineEl);
  return (p & Node.DOCUMENT_POSITION_FOLLOWING) ? -1 : (p & Node.DOCUMENT_POSITION_PRECEDING) ? 1 : 0;
});

function layout(){
  const wide = document.documentElement.clientWidth > 1000;
  if (wide !== marginMode) {
    marginMode = wide;
    cardInfo.forEach(ci => {
      if (wide) notesEl.appendChild(ci.cardEl);
      else ci.lineEl.after(ci.cardEl);
    });
  }
  if (!wide) { overlay.innerHTML = ""; return; }
  const boardTop = board.getBoundingClientRect().top;
  let prevBottom = 0;
  cardInfo.forEach(ci => {
    const y = ci.lineEl.getBoundingClientRect().top - boardTop;
    const top = Math.max(y - 4, prevBottom);
    ci.cardEl.style.top = top + "px";
    prevBottom = top + ci.cardEl.offsetHeight + 14;
  });
  notesEl.style.minHeight = prevBottom + "px";
  draw();
}

/* ---- hand-drawn connector arrows ---- */
function strokeColor(warn){
  return getComputedStyle(document.documentElement).getPropertyValue(warn ? "--y" : "--r").trim();
}
function roughArrowSVG(){
  seed = (seed*31+7) & 0x7fffffff;
  const y = 12;
  let d = `M 3 ${y+j(1)}`;
  for (let x=18; x<=54; x+=18) d += ` Q ${x-9+j(2)} ${y+j(2.2)} ${x+j(1)} ${y+j(1.5)}`;
  return `<svg width="60" height="24" viewBox="0 0 60 24" aria-hidden="true">
    <path d="${d}" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".7"/>
    <path d="M ${46+j(1)} ${y-5+j(1)} L 55 ${y} L ${46+j(1)} ${y+5+j(1)}" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
  </svg>`;
}
function draw(){
  overlay.innerHTML = ""; seed = 7;
  const b = board.getBoundingClientRect();
  overlay.setAttribute("width", b.width);
  overlay.setAttribute("height", board.scrollHeight);
  const caRect = codearea.getBoundingClientRect();
  cardInfo.forEach((ci, idx) => {
    const warn = ci.cardEl.classList.contains("warn");
    const mr = ci.anchorEl.getBoundingClientRect();
    if (mr.right > caRect.right - 8 || mr.left < caRect.left + 46) return; // scrolled out
    const cr = ci.cardEl.getBoundingClientRect();
    const x1 = cr.left - b.left - 5,  y1 = cr.top - b.top + 16;
    const x2 = Math.min(mr.right, caRect.right - 20) - b.left + 6;
    const y2 = mr.bottom - b.top - 1;
    const gx = caRect.right - b.left + 7 + (idx % 4) * 4 + j(2);
    let d;
    if (Math.abs(y1 - y2) < 14) {
      d = `M ${x1} ${y1} C ${x1-40+j(6)} ${y1+j(4)}, ${x2+50+j(6)} ${y2+j(3)}, ${x2+3} ${y2}`;
    } else {
      d = `M ${x1} ${y1} Q ${gx+j(4)} ${y1+j(4)} ${gx+j(2)} ${y1+(y2>y1?18:-18)}`
        + ` L ${gx+j(2)} ${y2+(y2>y1?-16:16)}`
        + ` Q ${gx+j(4)} ${y2+j(3)} ${x2+3} ${y2+j(1)}`;
    }
    addPath(d, 1.4, .6, warn);
    for (const dy of [-5.5, 5.5]) {
      addPath(`M ${x2+11+j(1.2)} ${y2+dy+j(1.2)} L ${x2+1} ${y2}`, 1.4, .6, warn);
    }
  });
}
function addPath(d, w, op, warn){
  const p = document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d", d);
  p.setAttribute("stroke", strokeColor(warn));
  p.setAttribute("stroke-width", w); p.setAttribute("fill", "none");
  p.setAttribute("stroke-linecap", "round"); p.setAttribute("opacity", op);
  overlay.appendChild(p);
}

/* ---- tooltip: L1 detail, L2 repeat-occurrence hint ---- */
const tip = document.getElementById("tip");
let pinnedMark = null;
function showTip(mk){
  const a = ANN[mk.dataset.id]; if (!a) return;
  if (a.lv===2) {
    tip.innerHTML = `<b style="color:var(--r)">🔴 ${esc(a.name||"")}</b>クリックでカードへ`;
  } else {
    tip.innerHTML = `<b>🟡 ${esc(a.name||"")}</b>${inline(a.what||"")}` +
      (a.ex ? `<span class="tipex">${esc(a.ex)}</span>` : "");
  }
  tip.style.display = "block";
  const r = mk.getBoundingClientRect();
  const x = r.left + window.scrollX, y = r.bottom + window.scrollY + 8;
  tip.style.left = Math.min(x, window.scrollX + document.documentElement.clientWidth - tip.offsetWidth - 12) + "px";
  tip.style.top = y + "px";
}
function hideTip(){ tip.style.display = "none"; }
document.addEventListener("mouseover", e => {
  if (pinnedMark) return;
  const mk = e.target.closest("mark");
  if (mk) showTip(mk); else hideTip();
});
document.addEventListener("mouseout", e => { if (!pinnedMark && e.target.closest("mark")) hideTip(); });
document.addEventListener("click", e => {
  const mk = e.target.closest("mark");
  if (!mk) {                                  // タップ/クリックが外れたら閉じる
    if (pinnedMark) { pinnedMark = null; hideTip(); }
    return;
  }
  const a = ANN[mk.dataset.id]; if (!a) return;
  if (a.lv===2) {
    pinnedMark = null; hideTip();
    const c = firstCardOf[mk.dataset.id];
    if (c) { c.scrollIntoView({behavior:"smooth", block:"center"});
      c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash"); }
  } else if (pinnedMark === mk) {             // 同じマークを再タップで閉じる
    pinnedMark = null; hideTip();
  } else {                                    // 開いたら勝手には閉じない
    pinnedMark = mk; showTip(mk);
  }
});

window.addEventListener("resize", () => { clearTimeout(layout._t); layout._t = setTimeout(layout, 120); });
codearea.addEventListener("scroll", () => requestAnimationFrame(draw));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
window.addEventListener("load", layout);
layout();
})();
</script>

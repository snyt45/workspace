[tasks.setup]
description = "全セットアップ実行"
depends = ["macos", "rosetta", "packages", "tools", "gems", "link", "npm-latest", "claude-plugins", "plannotator", "herdr", "auth"]
run = 'echo "セットアップ完了。再起動してください。"'

[tasks.tools]
description = "mise 管理ツールのインストール (~/.config/mise/config.toml の [tools])"
depends = ["packages"]
run = 'mise install'

[tasks.npm-latest]
description = "npm を最新化 (min-release-age v11.10+ のため)"
depends = ["tools"]
run = 'mise exec -- npm install -g npm@latest'

[tasks.gems]
description = "Ruby gems (nvimのruby-lsp。toypo-apiのruby版に合わせる)"
run = 'mise exec ruby@3.2.8 -- gem list -i ruby-lsp -q >/dev/null || mise exec ruby@3.2.8 -- gem install ruby-lsp'

[tasks.macos]
description = "macOS システム設定"
run = './scripts/macos.sh'

[tasks.rosetta]
description = "Rosetta 2 インストール"
run = '/usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license'

[tasks.packages]
description = "Homebrew パッケージインストール"
run = 'brew bundle --file=Brewfile'

[tasks.link]
description = "シンボリックリンク作成"
run = './scripts/link.sh'

[tasks.claude-plugins]
description = "Claude Code プラグインインストール"
depends = ["packages"]
run = './scripts/claude-plugins.sh'

[tasks.plannotator]
description = "Plannotator インストール (plan/diff/文書レビューUI)"
run = 'command -v plannotator >/dev/null || curl -fsSL https://plannotator.ai/install.sh | bash'

[tasks.herdr]
description = "herdr プラグイン・外部ツール統合のインストール"
depends = ["packages"]
run = './scripts/herdr.sh'

[tasks.auth]
description = "GitHub CLI 認証"
depends = ["packages"]
run = 'gh auth status 2>/dev/null || gh auth login'
